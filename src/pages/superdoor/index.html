<style>

html, body
{
  background-color: white;
  margin-top: 30px;
  font-family: sans-serif;
  zoom: 72%
}

#door
{
    position: relative
}

#prizeText
{
    opacity: 0;
}

#prizeText.show
{
    animation: prizeText 1s linear forwards;
}

@keyframes prizeText
{
    0% {opacity: 0}
    100% {opacity: 1}
}

#door.move
{
    animation: door 1s ease-in-out forwards;
}

@keyframes door
{
    0% {left: 0px}
    100% {left: 260px}
}

#doorArea
{
    width: fit-content;
    height: fit-content
}

#secretArea
{
    position: absolute;
    top: 775px;
    left: 510px;
}

#secret
{
    position: relative;
    transform: scale(0.2) rotate(0deg);
}

</style>
<body>

<div align='center'>
    
<div id='secretArea'>
    <img id='secret' src='assets/sekret.png'>
</div>

<div id='doorArea'>
    <img id='door' src='assets/door.png'>
</div>

<p id='prizeText' style='font-size: 40px; opacity: 0'>素晴らしい天才！！</p>

</div>

</body>
<script>
    
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function src(img)
{
    let asset = new Image()
    asset.src = img
    return asset.src
}

src('assets/door.png')

const sandboxed = window.self !== window.top // checks if the current html source is being used on another site!

const door = document.getElementById('door')
const doorArea = document.getElementById('doorArea')
const prizeText = document.getElementById('prizeText')
const secret = document.getElementById('secret')

setTimeout(async function() // secret shake
{
    while (true)
    {
        secret.style.transform = 'translateY(-435px) translateX(-340px) scale(0.2) rotate(0deg)'
        await sleep(100)
        secret.style.transform = 'translateY(-435px) translateX(-340px) scale(0.2) rotate(40deg)'
        await sleep(100)
    }
})

// TRANSLATIONS ///////////////
if (!sandboxed)
{
    
if (localStorage.getItem('opw_lang') == 'eng')
{
    prizeText.textContent = 'Intelligent!'
}

}
//////////////////////////////

let hoverListen = true
let mouseHover = false
let allow = true
let stopAlreadyHover = true
let challengeDone = false
let doorOpened = false

doorArea.addEventListener('mouseenter',function(){mouseHover = true})
doorArea.addEventListener('mouseleave',function(){mouseHover = false})

doorArea.addEventListener('mouseleave', function()
{
    allow = false
    stopAlreadyHover = false
})

//secret.style.visibility = 'hidden'

function completedChallenge()
{
    door.classList.add('move')
    prizeText.classList.add('show')
    doorOpened = true
    hoverListen = false
    
    secret.style.visibility = 'visible'
    secret.style.cursor = 'pointer'
    
    secret.addEventListener('click', function()
    {
        secret.style.cursor = ''
        alert('i')
    })
}


doorArea.addEventListener('mouseenter', async function()
{
    if (!hoverListen) return
    
    if (stopAlreadyHover)
    {
        for (let i = 0; i <= 1; i++)
        {
            door.style.visibility = 'hidden'
            await sleep(50)
            door.style.visibility = 'visible'
            await sleep(50)
        }
        return
    }
    
    hoverListen = false
    
    door.style.visibility = 'hidden'
    setTimeout(function()
    {
        door.style.visibility = 'visible'
        allow = true
        challengeDone = true
        if (mouseHover) hoverListen = true
        
        let check = setInterval(function()
        {
            if (!allow)
            {
                challengeDone = false
            }
        }, 10)
        
        setTimeout(function()
        {
            clearInterval(check)

            if (challengeDone)
            {
                completedChallenge()
            }
            else
            {
                hoverListen = true
            }
        }, 1000)
    }, 100)
})

</script>
