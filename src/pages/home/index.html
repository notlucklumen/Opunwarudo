<div align="center">
<img id="door" src="assets/home1.png">

<!--PAGE DEFAULTS-->

<html src='dev/page_defaults/index.html'></html>
<script src="dev/page_defaults/script.js"></script>
<!--END OF PAGE DEFAULTS-->

<script>
    
function src(img)
{
    let asset = new Image()
    asset.src = img
    return asset.src
}

const home1Asset = src('assets/home1.png')
const home2Asset = src('assets/home2.png')

const doorSound = new Audio('assets/door_open.wav')

const door = document.getElementById('door')
door.style.cursor = 'pointer'

let doorStage = 0

door.addEventListener('click', function()
{
    if (doorStage == 0)
    {
        door.src = home2Asset
        doorSound.play()
        doorStage = 1
    }
    
    if (doorStage == 1)
    {
        window.location.href = 'pages/superdoor'
    }
})

</script>
</html>
